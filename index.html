<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The AS/DS Collection</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="room">
    <h1 class="room-title">The AS/DS Collection</h1>
    <p class="collection-total" id="collection-total">—</p>

    <div class="ipod" id="ipod">
      <div class="ipod-screen-bezel">
        <div class="ipod-screen" id="stage-viewport">
          <div class="status-bar">
            <span id="status-count">Vinyl Collection</span>
            <button class="search-toggle" id="search-toggle" aria-label="Search">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
          </div>
          <div class="stage" id="stage"></div>
          <div class="now-playing">
            <div class="now-playing-title" id="now-title">—</div>
            <div class="now-playing-sub" id="now-sub">—</div>
            <div class="now-playing-price" id="now-price">—</div>
          </div>
          <div class="search-panel" id="search-panel" aria-hidden="true">
            <input type="text" class="search-input" id="search-input" placeholder="Enter your term" autocomplete="off" />
            <div class="search-results" id="search-results"></div>
          </div>
        </div>
      </div>

      <div class="click-wheel" id="click-wheel">
        <div class="wheel-label wheel-label-top">MENU</div>
        <div class="wheel-label wheel-label-left" aria-label="Previous">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="19,4 19,20 8,12"/><rect x="4" y="4" width="3" height="16"/></svg>
        </div>
        <div class="wheel-label wheel-label-right" aria-label="Next">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,4 5,20 16,12"/><rect x="17" y="4" width="3" height="16"/></svg>
        </div>
        <div class="wheel-label wheel-label-bottom" aria-label="Play">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
        </div>
        <button class="wheel-center" id="wheel-center" aria-label="Select record"></button>
      </div>
    </div>

    <p class="hint">Drag the wheel (or scroll / arrow keys) to spin the shelf · click a cover or press the center button to open the record</p>
  </div>

  <div class="detail-overlay" id="detail-overlay" aria-hidden="true">
    <div class="detail-card" id="detail-card">
      <button class="detail-close" id="detail-close" aria-label="Close">×</button>
      <div class="detail-cover-wrap">
        <img class="detail-cover" id="detail-cover" alt="" />
        <div class="detail-status">
          <span class="detail-condition-pill" id="detail-condition">—</span>
          <div class="detail-price-block">
            <span class="detail-price-value" id="detail-price-value">—</span>
            <span class="detail-price-sub" id="detail-price-sub"></span>
          </div>
        </div>
      </div>
      <div class="detail-body">
        <div class="detail-header">
          <h2 id="detail-album">—</h2>
          <h3 id="detail-artist">—</h3>
          <div class="detail-meta" id="detail-meta">—</div>
        </div>
        <div class="detail-section" id="detail-tracklist-section">
          <h4>Tracklist</h4>
          <ol id="detail-tracklist"></ol>
        </div>
        <div class="detail-section" id="detail-notes-section">
          <h4>Notes</h4>
          <p id="detail-notes">—</p>
        </div>
        <a class="detail-discogs-link" id="detail-discogs-link" href="#" target="_blank" rel="noopener">View on Discogs ↗</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
